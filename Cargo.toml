[workspace]
resolver = "2"
members = [
    "crates/engram-core",
    "crates/engram-proto",
    "crates/engramd",
    "crates/engram-cli",
    "crates/engram-gui",
    "tools/testbed",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Trendorin/engram"
rust-version = "1.88"

[workspace.dependencies]
engram-core = { path = "crates/engram-core" }
engram-proto = { path = "crates/engram-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rayon = "1"
memchr = "2"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
slint = "1"
slint-build = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: a much smaller target/ and faster linking.
debug = false
