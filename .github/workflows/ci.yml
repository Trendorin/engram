name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QMAKE: /usr/lib/qt6/bin/qmake

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: System packages (Qt 6 for the native window style)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools libfontconfig-dev libxkbcommon-dev appstream desktop-file-utils

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Tool reference is up to date
        run: cargo run -q --locked -p engram -- tools --markdown | diff -u docs/wiki/en/tools.md -

      - name: Desktop metadata
        run: |
          desktop-file-validate packaging/io.github.trendorin.Engram.desktop
          appstreamcli validate --no-net packaging/io.github.trendorin.Engram.metainfo.xml

      - name: Shell scripts parse
        run: for f in install.sh packaging/*/build.sh .github/release-notes.sh; do bash -n "$f"; done

  installer:
    name: install.sh on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, debian:trixie, debian:bookworm, ubuntu:24.04, fedora:44, opensuse/tumbleweed]
    steps:
      - name: What the checkout step needs
        run: if command -v zypper >/dev/null; then zypper -n install tar gzip findutils; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A fresh system: install.sh itself has to bring in every package it needs, on
      # Debian and Ubuntu Rust from rustup too.
      - name: Install from a bare image
        run: |
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm; fi
          ./install.sh --yes --prefix /opt/engram

      - name: Run
        run: |
          /opt/engram/bin/engram --version
          /opt/engram/bin/engramd --version
          /opt/engram/bin/engram tools | head -3

      - name: Uninstall leaves no files
        run: |
          ./install.sh --uninstall --yes --prefix /opt/engram
          # Menu and icon caches are shared with other programs and only refreshed.
          test -z "$(find /opt/engram -type f ! -name mimeinfo.cache ! -name icon-theme.cache)"
