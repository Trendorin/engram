name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QMAKE: /usr/lib/qt6/bin/qmake

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Qt 6 for the native window style)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools libfontconfig-dev libxkbcommon-dev appstream desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Tool reference is up to date
        run: cargo run -q --locked -p engram -- tools --markdown | diff -u docs/wiki/en/tools.md -

      - name: Desktop metadata
        run: |
          desktop-file-validate packaging/io.github.trendorin.Engram.desktop
          appstreamcli validate --no-net packaging/io.github.trendorin.Engram.metainfo.xml

      - name: Shell scripts parse
        run: for f in install.sh packaging/*/build.sh .github/release-notes.sh; do bash -n "$f"; done
