name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't post details of security problems here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Attach to ...
        2. Scan for ...
  - type: textarea
    id: doctor
    attributes:
      label: Output of `engram doctor`
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: e.g. Arch Linux, KDE Plasma 6 (Wayland)
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target program
      description: Native, Wine or Proton? Which game or program, if you can say.
  - type: textarea
    id: log
    attributes:
      label: Engine log
      description: Relevant lines from ~/.local/state/engram/engramd.log
      render: text
